    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad_PUMP_ELECTRICAL_SAFETY)"/>
  
  <circle cx="80" cy="70" r="160" fill="rgba(255,255,255,0.04)"/>
  <circle cx="530" cy="380" r="200" fill="rgba(255,255,255,0.04)"/>
  <circle cx="300" cy="225" r="150" fill="rgba(255,255,255,0.03)"/>

  <!-- Top Ribbon -->
  <rect x="0" y="0" width="600" height="44" fill="rgba(0,0,0,0.35)"/>
  <text x="30" y="27" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#4ade80">MD AGRO SERVICES • SONAI</text>
  <rect x="420" y="11" width="150" height="22" rx="11" fill="rgba(255,255,255,0.2)"/>
  <text x="495" y="26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff" text-anchor="middle">100% GENUINE</text>

  <!-- Central Card -->
  <rect x="45" y="65" width="510" height="320" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Icon Center -->
  <circle cx="300" cy="165" r="72" fill="rgba(255,255,255,0.12)"/>
  <circle cx="300" cy="165" r="54" fill="rgba(255,255,255,0.18)"/>
  <text x="300" y="184" font-size="62" text-anchor="middle" dominant-baseline="middle">⚡</text>

  <!-- Category Pill -->
  <rect x="180" y="258" width="240" height="28" rx="14" fill="#0f172a"/>
  <text x="300" y="276" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" fill="#4ade80" text-anchor="middle">PUMP ELECTRICAL SAFETY</text>

  <!-- Product Name -->
  <text x="300" y="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">L&T MK-1 DOL 3-Phase Starter</text>

