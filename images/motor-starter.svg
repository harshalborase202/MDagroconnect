  <text x="300" y="352" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle">Thermal Overload Protection for Agri Pumps</text>

  <!-- Bottom Quality Banner -->
  <rect x="0" y="415" width="600" height="35" fill="rgba(0,0,0,0.55)"/>
