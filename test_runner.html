        };

    <script src="/app.js"></script>

                if (window.errors.length === 0) {
                    const featGrid = document.getElementById('featured-products-grid');
                    const cardsCount = featGrid ? featGrid.children.length : 0;
                    document.getElementById('status').innerText = 'SUCCESS_VERIFIED: products=' + PRODUCTS.length + ', cards=' + cardsCount;
                }
            }, 300);
        });
    </script>
</body>
</html>
