services:
  - type: web
    name: md-agro-connect
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: mdagro
      - key: ADMIN_PASSWORD
        value: mdagro6074

